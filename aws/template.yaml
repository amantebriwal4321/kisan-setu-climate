AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Kisan Setu risk scorer (Lambda + API Gateway) and crop catalog (DynamoDB)

Globals:
  Function:
    Timeout: 5
    MemorySize: 128
    Runtime: nodejs20.x
    Architectures:
      - arm64
  HttpApi:
    CorsConfiguration:
      AllowOrigins:
        - "*"
      AllowHeaders:
        - content-type
      AllowMethods:
        - GET
        - POST
        - OPTIONS

Resources:
  CatalogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub kisan-setu-catalog-${AWS::StackName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  RiskFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub kisan-setu-risk-${AWS::StackName}
      CodeUri: lambda/risk/
      Handler: index.handler
      Description: Scores crop crash risk 0-100 from arrivals, price slide, and harvest month
      Events:
        ScorePost:
          Type: HttpApi
          Properties:
            Path: /risk
            Method: POST
            PayloadFormatVersion: "2.0"
            ApiId: !Ref RiskApi
        ScoreGet:
          Type: HttpApi
          Properties:
            Path: /risk
            Method: GET
            PayloadFormatVersion: "2.0"
            ApiId: !Ref RiskApi

  RiskApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod

Outputs:
  RiskApiUrl:
    Description: Set this as NEXT_PUBLIC_RISK_API_URL on the Next.js app
    Value: !Sub https://${RiskApi}.execute-api.${AWS::Region}.amazonaws.com/prod/risk
  CatalogTableName:
    Description: Set this as DYNAMODB_TABLE_NAME on the Next.js app and the seed script
    Value: !Ref CatalogTable
  Region:
    Description: Set this as AWS_REGION
    Value: !Ref AWS::Region
